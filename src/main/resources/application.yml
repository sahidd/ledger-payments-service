spring:
  application:
    name: ledger-payments-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:ledger}
    password: ${SPRING_DATASOURCE_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # Chat stays off until SPRING_AI_MODEL_CHAT=openai and OPENAI_API_KEY are both set.
  # An empty key must not activate the OpenAI client, so the property is omitted
  # unless OPENAI_API_KEY is present.
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash

info:
  app:
    name: ledger-payments-service
    description: Double-entry payments ledger

app:
  kafka:
    payments-topic: payments.events
  outbox:
    poll-delay-ms: 1000
    batch-size: 50
  risk:
    unusual-amount: 5000.00
    velocity-limit: 5
    velocity-window-seconds: 600
    average-multiplier: 5
    minimum-sample: 3

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      paymentGateway:
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        record-exceptions:
          - com.sahidanwar.ledger.domain.GatewayTransientException
  retry:
    retryAspectOrder: 2
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 50ms
        retry-exceptions:
          - com.sahidanwar.ledger.domain.GatewayTransientException

springdoc:
  swagger-ui:
    path: /swagger-ui.html
